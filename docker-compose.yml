# Local developer loop. Mirrors the Helm deployment: pgvector + app + seed.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind -d northwind"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      EMBED_PROVIDER: hashing
    command: ["python", "-m", "app.seed"]
    restart: "no"

  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
    environment:
      PGHOST: postgres
      EMBED_PROVIDER: hashing
      LLM_ENABLED: "false"
      GUARDRAILS_ENABLED: "false"
    ports: ["8080:8080"]

volumes:
  pgdata:
