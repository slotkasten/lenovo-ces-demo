{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "northwind.postgresql.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $key := .Values.postgresql.auth.secretKeys.passwordKey -}}
{{- $password := .Values.postgresql.auth.password -}}
{{- if not $password -}}
{{- if and $existing (index $existing.data $key) -}}
{{- $password = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "northwind.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # Keep the generated password stable across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
